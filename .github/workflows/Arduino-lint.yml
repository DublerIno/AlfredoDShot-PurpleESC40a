name: Arduino-lint

on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/arduino-lint-action@v3
        with:
          # "update" is the level for a library already in the index. Do not
          # set "submit" here: rule LP017 fails a name that is already indexed,
          # which now includes this one.
          library-manager: update
          compliance: strict
